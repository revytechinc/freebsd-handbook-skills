name: check-public
# Server-side copy of the pre-commit check: no public addresses, MAC addresses,
# personal e-mail addresses. Runs on every push and pull request, so it cannot
# be skipped locally. The private name list is not published, so CI runs
# without it.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned by commit
      - run: python3 tools/check-public.py --all --no-deny-list
