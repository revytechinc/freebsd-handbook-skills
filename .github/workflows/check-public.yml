name: check-public
# Server-side publication check, run on every push and pull request so it
# cannot be skipped locally: no public IP addresses, MAC addresses, personal
# e-mail addresses, and no private names from the deny list. The deny list is
# never published: CI reads it from the encrypted PUBLISH_DENY secret. Only a
# pull request from a fork (which never receives secrets) runs without it; a
# missing secret anywhere else fails the job.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DENY: ${{ secrets.PUBLISH_DENY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned by commit
      - name: regression tests for the safety tooling
        run: python3 tools/tests/test_tools.py
      - name: check, with the private deny list
        if: env.PUBLISH_DENY != ''
        run: |
          printf '%s\n' "$PUBLISH_DENY" > .publish-deny
          python3 tools/check-public.py --all
          rm -f .publish-deny
      # Without the secret, only a pull request from a fork may run the check
      # without the deny list (forks never receive secrets). Anywhere else a
      # missing secret means the repository is misconfigured: fail.
      - name: check, without the deny list (pull request from a fork)
        if: env.PUBLISH_DENY == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          rc=0; python3 tools/check-public.py --all --no-deny-list || rc=$?
          if [ "$rc" -eq 1 ]; then echo "::error::The partial check FOUND problems (see above). Replace each flagged item with a documentation address or example.org, then push again."; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "::error::The checker itself failed (exit $rc), so nothing was checked. If your change touches tools/, check that first; otherwise report the output above to the maintainers in the pull request."; exit 1; fi
          echo "::error::The partial check found nothing, but it ran WITHOUT the private deny list (fork pull request). A maintainer must run the full check before merging."
          exit 1
      - name: refuse to run without the deny list
        if: env.PUBLISH_DENY == '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "The PUBLISH_DENY secret is not configured; refusing to report clean without the deny list." >&2
          exit 1
